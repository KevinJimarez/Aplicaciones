name: Publicar EcoRuta PWA

on:
  push:
    branches: [main]
    paths:
      - "08-aplicacion-web-maquetada-ecoruta/**"
      - ".github/workflows/ecoruta-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar EcoRuta
        uses: actions/upload-pages-artifact@v4
        with:
          path: 08-aplicacion-web-maquetada-ecoruta

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
